<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Site Moderno - Dashboard{% endblock %}</title>
</head>
<body>
    <!-- Barra de Navegação Fixa -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <h2>ModernSite</h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#dashboard" class="nav-link active" onclick="showPage('dashboard')">
                        <span class="nav-icon">📊</span>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#search" class="nav-link" onclick="showPage('search')">
                        <span class="nav-icon">🔍</span>
                        Busca
                    </a>
                </li>
            </ul>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
<script>
        function showPage(pageId) {
            // Esconder todas as páginas
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            
            // Mostrar página selecionada
            document.getElementById(pageId).classList.add('active');
            
            // Atualizar navegação
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => link.classList.remove('active'));
            event.target.closest('.nav-link').classList.add('active');
        }

        function performSearch() {
            const searchTerm = document.getElementById('searchInput').value;
            const resultsContainer = document.getElementById('searchResults');
            
            if (searchTerm.trim()) {
                resultsContainer.innerHTML = `
                    <div class="result-item">
                        <h4>Resultado para: "${searchTerm}"</h4>
                        <p>Este é um resultado de exemplo para sua busca. Em um sistema real, aqui apareceriam os resultados relevantes.</p>
                        <span class="result-meta">Encontrado agora</span>
                    </div>
                `;
            }
        }

        // Pesquisa ao pressionar Enter
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // Funções do Modal de Autenticação
        function showAuthModal(type) {
            const modal = document.getElementById('authModal');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            
            modal.style.display = 'flex';
            
            if (type === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
        }

        function closeAuthModal() {
            const modal = document.getElementById('authModal');
            modal.style.display = 'none';
        }

        function switchToRegister() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
        }

        function switchToLogin() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
        }

        // Fechar modal ao clicar fora dele
        window.onclick = function(event) {
            const modal = document.getElementById('authModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
    color: #e1e1e6;
    min-height: 100vh;
    line-height: 1.6;
}

/* Barra de Navegação */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(26, 26, 46, 0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 1000;
    padding: 0 2rem;
}

.nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
    height: 70px;
}

.nav-brand h2 {
    color: #64ffda;
    font-weight: 700;
    font-size: 1.5rem;
}

.nav-menu {
    display: flex;
    list-style: none;
    gap: 2rem;
}

.nav-link {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: #b8b8cc;
    text-decoration: none;
    padding: 0.75rem 1.5rem;
    border-radius: 12px;
    transition: all 0.3s ease;
    font-weight: 500;
}

.nav-link:hover {
    color: #64ffda;
    background: rgba(100, 255, 218, 0.1);
    transform: translateY(-2px);
}

.nav-link.active {
    color: #64ffda;
    background: linear-gradient(135deg, rgba(100, 255, 218, 0.2), rgba(100, 255, 218, 0.1));
    box-shadow: 0 4px 15px rgba(100, 255, 218, 0.2);
}

.nav-icon {
    font-size: 1.2rem;
}

/* Conteúdo Principal */
.main-content {
    margin-top: 70px;
    padding: 2rem;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
}

.page {
    display: none;
    animation: fadeIn 0.5s ease-in;
}

.page.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.page-header {
    text-align: center;
    margin-bottom: 3rem;
}

.page-header h1 {
    font-size: 3rem;
    color: #64ffda;
    margin-bottom: 0.5rem;
    font-weight: 700;
}

.page-header p {
    color: #b8b8cc;
    font-size: 1.2rem;
}

/* Página Index/Hero */
.hero-section {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 0;
}

.hero-content {
    max-width: 1000px;
}

.hero-title {
    font-size: 4rem;
    font-weight: 800;
    background: linear-gradient(135deg, #64ffda, #4fc3f7, #bb86fc);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 1rem;
    line-height: 1.2;
}

.hero-subtitle {
    font-size: 1.3rem;
    color: #b8b8cc;
    margin-bottom: 4rem;
    line-height: 1.6;
}

.hero-features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2rem;
    margin-bottom: 4rem;
}

.feature {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 2rem;
    transition: all 0.3s ease;
}

.feature:hover {
    transform: translateY(-10px);
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(100, 255, 218, 0.3);
    box-shadow: 0 20px 40px rgba(100, 255, 218, 0.1);
}

.feature-icon {
    font-size: 3rem;
    display: block;
    margin-bottom: 1rem;
}

.feature h3 {
    color: #64ffda;
    font-size: 1.4rem;
    margin-bottom: 1rem;
    font-weight: 600;
}

.feature p {
    color: #b8b8cc;
    line-height: 1.6;
}

.auth-section {
    background: linear-gradient(135deg, rgba(100, 255, 218, 0.1), rgba(187, 134, 252, 0.1));
    border: 1px solid rgba(100, 255, 218, 0.2);
    border-radius: 25px;
    padding: 3rem;
    margin-top: 3rem;
}

.auth-section h2 {
    color: #64ffda;
    font-size: 2.5rem;
    margin-bottom: 1rem;
    font-weight: 700;
}

.auth-description {
    color: #b8b8cc;
    font-size: 1.1rem;
    margin-bottom: 2rem;
}

.auth-buttons {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
}

.auth-btn {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 2rem;
    border: none;
    border-radius: 15px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    min-width: 160px;
    justify-content: center;
}

.login-btn {
    background: linear-gradient(135deg, #4fc3f7, #29b6f6);
    color: white;
}

.login-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(79, 195, 247, 0.4);
}

.register-btn {
    background: linear-gradient(135deg, #64ffda, #4db6ac);
    color: #1a1a2e;
}

.register-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(100, 255, 218, 0.4);
}

.btn-icon {
    font-size: 1.2rem;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: linear-gradient(135deg, rgba(26, 26, 46, 0.95), rgba(22, 33, 62, 0.95));
    border: 1px solid rgba(100, 255, 218, 0.2);
    border-radius: 20px;
    padding: 2rem;
    max-width: 400px;
    width: 90%;
    position: relative;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
}

.close {
    position: absolute;
    right: 1rem;
    top: 1rem;
    font-size: 2rem;
    font-weight: bold;
    color: #b8b8cc;
    cursor: pointer;
    transition: color 0.3s ease;
}

.close:hover {
    color: #64ffda;
}

.auth-form h2 {
    color: #64ffda;
    text-align: center;
    margin-bottom: 2rem;
    font-size: 1.8rem;
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-group label {
    display: block;
    color: #b8b8cc;
    margin-bottom: 0.5rem;
    font-weight: 500;
}

.form-group input {
    width: 100%;
    padding: 0.75rem;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    color: #e1e1e6;
    font-size: 1rem;
    transition: all 0.3s ease;
}

.form-group input:focus {
    outline: none;
    border-color: #64ffda;
    box-shadow: 0 0 10px rgba(100, 255, 218, 0.3);
}

.form-group input::placeholder {
    color: #b8b8cc;
}

.form-submit-btn {
    width: 100%;
    padding: 1rem;
    background: linear-gradient(135deg, #64ffda, #4fc3f7);
    border: none;
    border-radius: 10px;
    color: #1a1a2e;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-bottom: 1rem;
}

.form-submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(100, 255, 218, 0.4);
}

.form-switch {
    text-align: center;
    color: #b8b8cc;
}

.form-switch a {
    color: #64ffda;
    text-decoration: none;
    font-weight: 600;
}

.form-switch a:hover {
    text-decoration: underline;
}

/* Responsividade para Index */
@media (max-width: 768px) {
    .hero-title {
        font-size: 2.5rem;
    }
    
    .hero-subtitle {
        font-size: 1.1rem;
    }
    
    .hero-features {
        grid-template-columns: 1fr;
    }
    
    .auth-section {
        padding: 2rem;
    }
    
    .auth-section h2 {
        font-size: 2rem;
    }
    
    .auth-buttons {
        flex-direction: column;
        align-items: center;
    }
    
    .auth-btn {
        width: 100%;
        max-width: 250px;
    }
}
.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
}

.card {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 2rem;
    transition: all 0.3s ease;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    border-color: rgba(100, 255, 218, 0.3);
}

.card.full-width {
    grid-column: 1 / -1;
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
}

.card-header h3 {
    color: #e1e1e6;
    font-size: 1.3rem;
    font-weight: 600;
}

.card-icon {
    font-size: 1.5rem;
    opacity: 0.7;
}

.stat {
    display: flex;
    flex-direction: column;
    margin-bottom: 1rem;
}

.stat-number {
    font-size: 2.5rem;
    font-weight: 700;
    color: #64ffda;
}

.stat-label {
    color: #b8b8cc;
    font-size: 0.9rem;
}

.activity-item {
    display: flex;
    justify-content: space-between;
    padding: 0.75rem 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.activity-item:last-child {
    border-bottom: none;
}

.activity-time {
    color: #64ffda;
    font-weight: 600;
}

.activity-desc {
    color: #b8b8cc;
}

/* Gráfico */
.chart-placeholder {
    text-align: center;
}

.chart-bars {
    display: flex;
    align-items: end;
    justify-content: center;
    gap: 0.5rem;
    height: 150px;
    margin-top: 1rem;
}

.bar {
    width: 30px;
    background: linear-gradient(to top, #64ffda, #4fc3f7);
    border-radius: 4px;
    transition: all 0.3s ease;
}

.bar:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px rgba(100, 255, 218, 0.5);
}

/* Busca */
.search-container {
    max-width: 800px;
    margin: 0 auto;
}

.search-box {
    display: flex;
    margin-bottom: 2rem;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    padding: 0.5rem;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

.search-input {
    flex: 1;
    background: none;
    border: none;
    padding: 1rem 1.5rem;
    color: #e1e1e6;
    font-size: 1.1rem;
    outline: none;
}

.search-input::placeholder {
    color: #b8b8cc;
}

.search-btn {
    background: linear-gradient(135deg, #64ffda, #4fc3f7);
    border: none;
    padding: 1rem 1.5rem;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1.2rem;
    transition: all 0.3s ease;
}

.search-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(100, 255, 218, 0.4);
}

.search-filters {
    display: flex;
    gap: 2rem;
    margin-bottom: 2rem;
    justify-content: center;
}

.filter-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.filter-group label {
    color: #b8b8cc;
    font-weight: 500;
}

.filter-select {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 8px;
    padding: 0.75rem;
    color: #e1e1e6;
    outline: none;
}

.search-results {
    margin-top: 2rem;
}

.result-item {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 15px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    transition: all 0.3s ease;
}

.result-item:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateX(10px);
    border-color: rgba(100, 255, 218, 0.3);
}

.result-item h4 {
    color: #64ffda;
    margin-bottom: 0.5rem;
    font-size: 1.2rem;
}

.result-item p {
    color: #b8b8cc;
    margin-bottom: 0.75rem;
}

.result-meta {
    color: #64ffda;
    font-size: 0.9rem;
    opacity: 0.8;
}

/* Responsividade */
@media (max-width: 768px) {
    .nav-container {
        flex-direction: column;
        height: auto;
        padding: 1rem 0;
    }

    .nav-menu {
        margin-top: 1rem;
    }

    .main-content {
        margin-top: 120px;
        padding: 1rem;
    }

    .page-header h1 {
        font-size: 2rem;
    }

    .dashboard-grid {
        grid-template-columns: 1fr;
    }

    .search-filters {
        flex-direction: column;
        gap: 1rem;
    }
}

/* Scrollbar personalizada */
::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.1);
}

::-webkit-scrollbar-thumb {
    background: linear-gradient(135deg, #64ffda, #4fc3f7);
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(135deg, #4fc3f7, #64ffda);
}
</style>
